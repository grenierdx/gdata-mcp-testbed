[project]
name = "gdata-mcp-testbed"
version = "0.1.0"
description = "A simple test of the Python MCP SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
